<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物販台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b2530;
  --bg-2: #123746;
  --glass: rgba(255,255,255,.07);
  --glass-strong: rgba(255,255,255,.12);
  --line: rgba(255,255,255,.16);
  --text: #eaf4f7;
  --muted: #93b0ba;
  --sales: #4fd6c1;
  --sales-ink: #062a25;
  --expense: #ffb35c;
  --expense-ink: #33200a;
  --danger: #ff7a8a;
  --nav: rgba(10,30,40,.82);
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e6f1f4;
    --bg-2: #d3e6ec;
    --glass: rgba(255,255,255,.7);
    --glass-strong: rgba(255,255,255,.95);
    --line: rgba(10,50,65,.16);
    --text: #0d2b36;
    --muted: #4d6b76;
    --sales: #0a8f7c;
    --sales-ink: #ffffff;
    --expense: #c5670a;
    --expense-ink: #ffffff;
    --danger: #c9354a;
    --nav: rgba(255,255,255,.9);
    --shadow: 0 10px 30px rgba(10,50,65,.18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e6f1f4;
  --bg-2: #d3e6ec;
  --glass: rgba(255,255,255,.7);
  --glass-strong: rgba(255,255,255,.95);
  --line: rgba(10,50,65,.16);
  --text: #0d2b36;
  --muted: #4d6b76;
  --sales: #0a8f7c;
  --sales-ink: #ffffff;
  --expense: #c5670a;
  --expense-ink: #ffffff;
  --danger: #c9354a;
  --nav: rgba(255,255,255,.9);
  --shadow: 0 10px 30px rgba(10,50,65,.18);
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
body {
  min-height: 100%;
  background: radial-gradient(120% 60% at 50% 0%, var(--bg-2), var(--bg) 70%) fixed;
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
}
.app { max-width: 480px; margin: 0 auto; padding: 18px 16px 120px; }

header.top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
.brand { font-family: var(--serif); font-weight: 700; font-size: 22px; letter-spacing: .08em; }
.sub { color: var(--muted); font-size: 13px; }

.card {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
h2.title { font-family: var(--serif); font-size: 24px; margin: 0 0 14px; letter-spacing: .06em; }

/* month switcher */
.month { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.month button {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--glass); color: var(--text); font-size: 18px; cursor: pointer;
}
.month .label { font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: .06em; }

/* summary */
.balance { padding: 20px 18px; margin-bottom: 12px; }
.balance .k { color: var(--muted); font-size: 13px; }
.balance .v { font-family: var(--serif); font-size: 40px; font-weight: 700; letter-spacing: .02em; line-height: 1.2; }
.balance .v.neg { color: var(--danger); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.pair .card { padding: 14px; }
.pair .k { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.s { background: var(--sales); } .dot.e { background: var(--expense); }
.pair .v { font-size: 22px; font-weight: 700; margin-top: 2px; }

.sec-title { font-size: 14px; color: var(--muted); margin: 6px 4px 10px; display: flex; justify-content: space-between; align-items: center; }
.sec-title button { background: none; border: 0; color: var(--sales); font-size: 14px; padding: 8px 4px; cursor: pointer; }

/* list */
.list { display: flex; flex-direction: column; gap: 10px; }
.row {
  display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center;
  background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 12px 0;
  width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer;
}
.row .bar { align-self: stretch; border-radius: 0 4px 4px 0; }
.row .bar.s { background: var(--sales); } .row .bar.e { background: var(--expense); }
.row .main { min-width: 0; }
.row .memo { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 13px; color: var(--muted); }
.row .amt { font-weight: 700; font-size: 18px; white-space: nowrap; }
.row .amt.s { color: var(--sales); } .row .amt.e { color: var(--expense); }
.day { font-size: 13px; color: var(--muted); margin: 16px 4px 8px; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }

/* form */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); margin-bottom: 18px; }
.seg button {
  height: 56px; border: 0; border-radius: 13px; background: transparent; color: var(--muted);
  font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"].s { background: var(--sales); color: var(--sales-ink); }
.seg button[aria-pressed="true"].e { background: var(--expense); color: var(--expense-ink); }
label.f { display: block; font-size: 14px; color: var(--muted); margin: 0 4px 6px; }
.field {
  width: 100%; height: 56px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--glass); color: var(--text); font: inherit; font-size: 18px; padding: 0 16px;
  margin-bottom: 18px; outline: none;
}
.field:focus-visible, button:focus-visible { outline: 2px solid var(--sales); outline-offset: 2px; }
input[type="date"].field { appearance: none; -webkit-appearance: none; text-align: left; min-height: 56px; }
.money { position: relative; }
.money span { position: absolute; left: 18px; top: 12px; font-size: 26px; color: var(--muted); font-weight: 700; }
.money .field { font-size: 32px; font-weight: 700; padding-left: 46px; height: 68px; }
.primary {
  width: 100%; height: 60px; border: 0; border-radius: 18px; font: inherit; font-size: 19px; font-weight: 700; cursor: pointer;
  background: var(--sales); color: var(--sales-ink);
}
.primary.e { background: var(--expense); color: var(--expense-ink); }
.ghost { width: 100%; height: 52px; margin-top: 10px; border-radius: 16px; border: 1px solid var(--line); background: transparent; color: var(--danger); font: inherit; font-size: 16px; cursor: pointer; }
.err { color: var(--danger); font-size: 14px; margin: -10px 4px 14px; min-height: 0; }

/* nav */
nav.dock {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 3px; padding: 7px; border-radius: 30px; background: var(--nav);
  border: 1px solid var(--line); box-shadow: var(--shadow);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 10;
}
nav.dock button {
  width: 62px; height: 56px; border: 0; border-radius: 22px; background: #ffffff; color: #0d2b36;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: inherit; font-size: 10px; cursor: pointer;
}
nav.dock button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.dock button[aria-current="page"] { background: var(--sales); color: var(--sales-ink); font-weight: 700; }
body.locked nav.dock { display: none; }
.tbl-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr { cursor: pointer; }
table.t .r { text-align: right; white-space: nowrap; font-weight: 700; }
table.t .memo-c { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.tag.s { background: var(--sales); color: var(--sales-ink); }
.tag.e { background: var(--expense); color: var(--expense-ink); }
table.t .r.s { color: var(--sales); } table.t .r.e { color: var(--expense); }
.logout-link { background: none; border: 0; color: var(--sales); font: inherit; font-size: 14px; padding: 10px; cursor: pointer; text-decoration: underline; }
.by { color: var(--muted); font-size: 11px; }
.gear { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); color: var(--text); display: grid; place-items: center; cursor: pointer; }
.gear svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; display: none; align-items: flex-end; justify-content: center; }
.scrim.open { display: flex; }
.sheet { width: 100%; max-width: 480px; max-height: 88%; overflow-y: auto; background: var(--bg-2); border: 1px solid var(--line); border-radius: 24px 24px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { font-family: var(--serif); font-size: 20px; margin: 4px 4px 14px; letter-spacing: .06em; }
.menu-item { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; margin-bottom: 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); color: var(--text); font: inherit; font-size: 17px; cursor: pointer; }
.menu-item.danger { color: var(--danger); }
.menu-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.user-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; margin-bottom: 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); }
.user-row small { color: var(--muted); }
.user-row button { border: 1px solid var(--line); background: transparent; color: var(--danger); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }
.sheet .note { color: var(--muted); font-size: 13px; margin: 0 4px 14px; }
.sheet .ok { color: var(--sales); font-size: 14px; margin: 0 4px 12px; }
.sheet .field { margin-bottom: 12px; }
.sheet .primary { height: 54px; font-size: 17px; }
.sheet .ghost { color: var(--text); }
.sheet textarea.field { height: 110px; padding: 12px 16px; font-size: 13px; resize: none; }
.login { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; }
.login .mark { width: 76px; height: 76px; border-radius: 22px; margin: 0 auto 18px; display: grid; place-items: center; background: #0a1c24; border: 1px solid var(--line); font-family: var(--serif); font-size: 42px; color: var(--sales); }
.login h1 { font-family: var(--serif); text-align: center; font-size: 26px; letter-spacing: .1em; margin: 0 0 4px; }
.login p.lead { text-align: center; color: var(--muted); margin: 0 0 22px; font-size: 14px; }
.login .card { padding: 20px; }
.login .field { margin-bottom: 14px; }

.toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -140%);
  background: var(--sales); color: var(--sales-ink); font-weight: 700; padding: 12px 20px; border-radius: 999px;
  transition: transform .25s ease; z-index: 20; box-shadow: var(--shadow);
}
.toast.show { transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast, .seg button { transition: none; } }

#printarea { display: none; }
@page { size: A4 portrait; margin: 14mm; }
@media print {
  html, body { background: #fff !important; color: #000 !important; }
  :root { padding: 0 !important; }
  .app, nav.dock, .toast, .scrim { display: none !important; }
  #printarea { display: block !important; }
}
.note { color: var(--muted); font-size: 13px; margin: 0 4px 12px; }
.seg.c3 { grid-template-columns: repeat(3, 1fr); }
.seg.c3 button { height: 46px; font-size: 15px; }
.seg.c3 button[aria-pressed="true"] { background: var(--sales); color: var(--sales-ink); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.gbtn { height: 50px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); color: var(--text); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
.ghost.n { color: var(--text); }
.sheet .ghost.danger { color: var(--danger); }
.nm { font-weight: 600; }
.no { color: var(--muted); font-size: 11px; letter-spacing: .02em; }
.tag.stock { background: var(--sales); color: var(--sales-ink); }
.tag.sold { background: var(--glass-strong); color: var(--muted); border: 1px solid var(--line); }
.tag.lost { background: var(--danger); color: #fff; }
.profit { font-size: 12px; color: var(--sales); font-weight: 600; }
.profit.neg { color: var(--danger); }
.rowcard { border: 1px solid var(--line); background: var(--glass); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
.rowcard .field { height: 48px; font-size: 16px; margin-bottom: 10px; }
.rowcard .two { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
.rowcard .two .field { margin-bottom: 0; }
.rowcard .rm { background: none; border: 0; color: var(--danger); font: inherit; font-size: 13px; padding: 10px 0 0; cursor: pointer; }
.chkrow { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); color: var(--text); font: inherit; cursor: pointer; }
.chkrow .box { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; color: transparent; font-weight: 700; }
.chkrow.on { border-color: var(--sales); }
.chkrow.on .box { background: var(--sales); border-color: var(--sales); color: var(--sales-ink); }
.chkrow .main { flex: 1; min-width: 0; }
.chkrow .amt { font-weight: 700; white-space: nowrap; }
.bar { height: 10px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line); overflow: hidden; margin: 8px 0 14px; }
.bar > div { height: 100%; background: var(--sales); }
.kv { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
.kv span:first-child { color: var(--muted); }
.reasons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.reasons button { height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); color: var(--danger); font: inherit; font-weight: 700; cursor: pointer; }
.miss { display: grid; grid-template-columns: 1fr 110px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.miss .field { height: 46px; font-size: 15px; margin-bottom: 0; padding: 0 10px; }
.hint { font-size: 13px; margin: 0 4px 12px; min-height: 0; color: var(--muted); }
.hint.ok { color: var(--sales); font-weight: 600; }
.hint.ng { color: var(--danger); }
select.field { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 22px) 24px, calc(100% - 16px) 24px; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
.miss select.field { background-position: calc(100% - 20px) 20px, calc(100% - 14px) 20px; }
.two2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label.mini { display: block; font-size: 12px; color: var(--muted); }
label.mini .field { margin-top: 4px; margin-bottom: 0; height: 46px; font-size: 16px; }
.an-card { padding: 16px; margin-bottom: 14px; }
.an-title { font-family: var(--serif); font-size: 18px; margin: 0 0 10px; letter-spacing: .04em; }
.lgd { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; }
.lgd i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.donut-wrap { display: flex; align-items: center; gap: 10px; }
.dleg { flex: 1; min-width: 0; font-size: 13px; }
.dli { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
.dsw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dli .nm2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dli b { white-space: nowrap; font-size: 12px; }
.rk { padding: 8px 0; cursor: pointer; }
.rk-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.rk-top .nm2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk-bar { height: 8px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line); overflow: hidden; margin-top: 5px; }
.rk-bar > div { height: 100%; border-radius: 999px; }
.th { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; flex: none; }
.ir { display: flex; align-items: center; gap: 8px; }
.hint .th { width: 28px; height: 28px; vertical-align: middle; margin-right: 6px; border-radius: 6px; }
.prow { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.pbtn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); color: var(--text); font-size: 13px; cursor: pointer; }
.pthumb { width: 52px; height: 52px; object-fit: cover; border-radius: 10px; }
.phbox { margin: 6px 0 12px; }
.phbox img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 14px; background: var(--glass); }
.noph { padding: 14px; text-align: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 14px; }
.cands { display: flex; flex-direction: column; gap: 8px; margin: 0 0 14px; }
.cand { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
.chkrow .th { margin-left: -4px; }
.ocrmsg { margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.6; background: var(--glass); border: 1px solid var(--line); }
.ocrmsg.ok { border-color: var(--sales); }
.ocrmsg.err { border-color: var(--danger); color: var(--danger); }
.ocrmsg .ng { color: var(--danger); font-weight: 700; }
.ocrmsg details { margin-top: 6px; color: var(--muted); }
.ocrmsg pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; max-height: 160px; overflow: auto; margin: 6px 0 0; }
.qthumb { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.qthumb img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; flex: none; }
.qthumb span { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="printarea"></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav class="dock" id="dock" aria-label="メニュー">
  <button data-view="home" aria-label="ホーム">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>ホーム
  </button>
  <button data-view="add" class="plus" aria-label="記録を追加">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>記録する
  </button>
  <button data-view="stock" aria-label="在庫">
    <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>在庫
  </button>
  <button data-view="history" aria-label="履歴">
    <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>履歴
  </button>
  <button data-view="analytics" aria-label="分析">
    <svg viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>分析

/* ---------- auth helpers ---------- */
async function toEmail(name) {
  const data = new TextEncoder().encode(name.trim().normalize("NFKC").toLowerCase());
  const buf = await crypto.subtle.digest("SHA-256", data);
  const hex = Array.from(new Uint8Array(buf)).map((x) => x.toString(16).padStart(2, "0")).join("").slice(0, 40);
  return "u" + hex + "@buppan-daicho.app";
}
function friendly(e) {
  const c = (e && e.code) || "";
  if (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found" || c === "auth/invalid-email") return "ユーザー名かパスワードが違います。";
  if (c === "auth/weak-password") return "パスワードは6文字以上にしてください。";
  if (c === "name-taken") return "そのユーザー名はすでに使われています。";
  if (c === "full") return "登録できるユーザーは" + MAXU + "人までです。";
  if (c === "bad-code") return "登録コードが違います（または5人の枠がいっぱいです）。";
  if (c === "auth/network-request-failed") return "通信できません。電波を確認してください。";
  if (c === "auth/too-many-requests") return "失敗が続いたため、しばらくしてからもう一度お試しください。";
  if (c === "not-member") return "このユーザーは登録されていません。「新しいユーザーを登録する」から登録してください。";
  if (c === "permission-denied") return "権限がありません。";
  return "うまくいきませんでした。もう一度お試しください。";
}

function teardown() {
  unsubs.forEach((u) => { try { u(); } catch (e) {} });

}

async function startSession(user, announce) {
  const snap = await getDoc(doc(db, "members", user.uid));
  if (!snap.exists()) {
    notice = "このユーザーは登録されていません。登録し直してください。";
    await signOut(auth);
    return;
  }
  const d = snap.data();
  me = { uid: user.uid, name: d.name, slot: String(d.slot) };
  unsubs.forEach((u) => { try { u(); } catch (e) {} });
  unsubs = [];
  const toList = (s) => s.docs.map((x) => Object.assign({ id: x.id }, x.data()));
  unsubs.push(onSnapshot(collection(db, "lots"), (s) => { lots = toList(s); refresh(); }, () => {}));
  unsubs.push(onSnapshot(collection(db, "items"), (s) => { items = toList(s); refresh(); }, () => { toast("在庫を読み込めませんでした"); }));
  unsubs.push(onSnapshot(collection(db, "counts"), (s) => { counts = toList(s); refresh(); }, () => {}));
  unsubs.push(onSnapshot(doc(db, "state", "suppliers"), (s) => { const d = s.exists() ? s.data() : null; suppliers = d && Array.isArray(d.list) ? d.list : null; refresh(); }, () => {}));
  unsubs.push(onSnapshot(doc(db, "state", "sites"), (s) => { const d = s.exists() ? s.data() : null; sites = d && Array.isArray(d.list) ? d.list : []; refresh(); }, () => {}));
  unsubs.push(onSnapshot(doc(db, "state", "count"), (s) => { countState = s.exists() ? s.data() : null; refresh(); }, () => {}));
  unsubs.push(onSnapshot(collection(db, "records"),
    (s) => { records = s.docs.map((x) => Object.assign({ id: x.id }, x.data())); refresh(); },
    () => { toast("記録を読み込めませんでした"); }));
  unsubs.push(onSnapshot(collection(db, "members"),
    (s) => {
      members = s.docs.map((x) => Object.assign({ uid: x.id }, x.data())).sort((a, b) => Number(a.slot) - Number(b.slot));
      if (sheetKind === "users") sheetUsers();
    },
    () => {}));
  notice = "";
  state.view = "home";
  document.body.classList.remove("locked");
  render();

}

async function cleanupUser(user) {
  try { await user.delete(); } catch (e) { try { await signOut(auth); } catch (x) {} }
}

async function register(name, pw, email, code) {
  let user;
  try {
    user = (await createUserWithEmailAndPassword(auth, email, pw)).user;
  } catch (e) {
    if (e.code === "auth/email-already-in-use") {
      try { user = (await signInWithEmailAndPassword(auth, email, pw)).user; }
      catch (e2) { throw { code: "name-taken" }; }
    } else throw e;
  }
  const mine = await getDoc(doc(db, "members", user.uid));
  if (mine.exists()) { await startSession(user, true); return; }
  const used = new Set((await getDocs(collection(db, "slots"))).docs.map((d) => d.id));
  let slot = "";
  for (let i = 1; i <= MAXU; i++) { if (!used.has(String(i))) { slot = String(i); break; } }
  if (!slot) { await cleanupUser(user); throw { code: "full" }; }
  const batch = writeBatch(db);
  batch.set(doc(db, "members", user.uid), { name: name, slot: slot, code: code, createdAt: Date.now() });
  batch.set(doc(db, "slots", slot), { uid: user.uid, name: name });
  try { await batch.commit(); } catch (e) { await cleanupUser(user); throw { code: "bad-code" }; }
  await startSession(user, true);
}

async function doLogin() {
  if (busy) return;
  const err = $("l-err");
  const name = val("l-id").trim().normalize("NFKC"), pw = val("l-pw");
  const reg = loginMode === "register";
  err.textContent = "";
  if (!name || !pw) { err.textContent = "ユーザー名とパスワードを入力してください。"; return; }
  if (reg) {
    if (pw.length < 6) { err.textContent = "パスワードは6文字以上にしてください。"; return; }
    if (pw !== val("l-pw2")) { err.textContent = "パスワードが一致しません。"; return; }
    if (!val("l-code").trim()) { err.textContent = "登録コードを入力してください。"; return; }
  }
  busy = true;
  const btn = $("login"); btn.disabled = true; btn.textContent = "少々お待ちください…";
  try {
    const email = await toEmail(name);
    if (reg) {
      await register(name, pw, email, val("l-code").trim());
      loginMode = "login";
    } else {
      const cred = await signInWithEmailAndPassword(auth, email, pw);
      await startSession(cred.user, true);
      if (!me) throw { code: "not-member" };
    }
  } catch (e) {
    const er = $("l-err");
    if (er) er.textContent = friendly(e);
    const b2 = $("login"); if (b2) { b2.disabled = false; b2.textContent = reg ? "登録してログイン" : "ログイン"; }
  } finally {
    busy = false;
  }
}

function refresh() {

/* ---------- save / delete ---------- */
async function doSave() {
  const date = val("f-date");
  const amount = parseInt(toHalf(val("f-amt")).replace(/[^0-9]/g, ""), 10);
  const memo = val("f-memo").trim().slice(0, 100);
  const err = $("err");
  if (!date) { err.textContent = "日付を選んでください。"; return; }
  if (!amount) { err.textContent = "金額を入力してください。"; return; }
  const isS = state.type === "sales";
  const wasEdit = !!state.editId;
  const old = wasEdit ? records.filter((r) => r.id === state.editId)[0] : null;
  let siteName = "";
  if (isS) {
    const sv3 = val("f-site");
    if (sv3 === "__other") { siteName = val("f-site-o").trim().slice(0, 20); if (!siteName) { err.textContent = "販売サイトを入力してください。"; return; } }
    else siteName = sv3;
  }
  let fee = 0, ship = 0;
  if (isS) {
    const fv = numOf(val("f-fee")), sv = numOf(val("f-ship"));
    fee = isNaN(fv) ? 0 : fv;
    ship = isNaN(sv) ? 0 : sv;
    if (fee > amount) { err.textContent = "手数料が、売値より大きくなっています。"; return; }
  }
  let shipm = "";
  if (isS) {
    const sv2 = val("f-shipm");
    if (sv2 === "__other") { shipm = val("f-shipm-o").trim().slice(0, 20); if (!shipm) { err.textContent = "発送方法を入力してください。"; return; } }
    else shipm = sv2;
  }
  let category = "";
  if (!isS) {
    category = val("f-cat");
    if (!category) { err.textContent = "経費の種類を選んでください。"; return; }
  }
  const tradeId = (!wasEdit && isS) ? (state.tradeId || "") : "";
  if (tradeId && records.some((r) => r.orderId === tradeId)) { err.textContent = "この取引（" + tradeId + "）は、すでに登録されています。"; return; }
  let it = null;
  const itemNo = (!wasEdit && isS) ? val("f-no").trim() : "";
  if (itemNo) {
    it = findItemByNo(itemNo);
    if (!it) { err.textContent = "この商品番号は登録されていません。"; return; }
    if (it.status === "sold") { err.textContent = "この商品は、すでに販売済みです。"; return; }
    if (it.status === "lost") { err.textContent = "この商品は、在庫から外れています。在庫の画面で「在庫に戻す」を押してください。"; return; }
  }
  const btn = $("save");
  if (isS && !wasEdit && !itemNo && !btn.dataset.sure) {
    btn.dataset.sure = "1";
    err.textContent = "商品番号が入っていません。このまま記録すると、在庫（点数）からは引かれません。よろしければ、もう一度「記録する」を押してください。";
    return;
  }
  btn.disabled = true;
  let p;
  if (it) {
    const rref = doc(collection(db, "records")), batch = writeBatch(db);
    batch.update(doc(db, "items", it.id), { status: "sold", price: amount, soldDate: date, recordId: rref.id, site: siteName, fee: fee, shipping: ship, shipMethod: shipm });
    batch.set(rref, { type: "sales", date: date, amount: amount, memo: (memo || (it.name + "（" + it.no + "）")).slice(0, 100), by: me.name, uid: me.uid, createdAt: Date.now(), itemId: it.id, site: siteName, fee: fee, shipping: ship, shipMethod: shipm, orderId: tradeId });
    p = batch.commit();
  } else if (wasEdit) {
    const data = { type: state.type, date: date, amount: amount, memo: memo, site: isS ? siteName : "", fee: isS ? fee : 0, shipping: isS ? ship : 0, shipMethod: isS ? shipm : "", category: isS ? "" : category };
    p = setDoc(doc(db, "records", state.editId), data, { merge: true });
  } else {
    const data = { type: state.type, date: date, amount: amount, memo: memo, by: me.name, uid: me.uid, createdAt: Date.now() };
    if (isS) { data.site = siteName; data.fee = fee; data.shipping = ship; data.shipMethod = shipm; if (tradeId) data.orderId = tradeId; }
    else data.category = category;
    p = setDoc(doc(collection(db, "records")), data);
  }
  let done = false, failed = false;
  p.then(() => { done = true; }, (e) => { failed = true; window.__lastErr = e; toast("保存できませんでした"); });
  await Promise.race([p.catch(() => {}), new Promise((r) => setTimeout(r, 5000))]);
  if (failed) { btn.disabled = false; err.textContent = "保存できませんでした。通信や権限を確認してください。" + errSuffix(); return; }
  state.month = date.slice(0, 7);
  state.editId = null;
  state.tradeId = ""; state.ocrHtml = ""; state.candsHtml = "";
  const extra = isS && (fee || ship) ? "（" + [fee ? "手数料 " + yen(fee) : "", ship ? "送料 " + yen(ship) : ""].filter(Boolean).join("・") + "）" : "";
  toast(done ? (wasEdit ? "保存しました" : (it ? "記録して、在庫から外しました" : "記録しました") + extra) : "通信待ちです。つながると自動で保存されます");
  go("home");
}

async function doDelete(btn) {
  if (!btn.dataset.sure) { btn.dataset.sure = "1"; btn.textContent = "もう一度押すと削除します"; return; }
  const id = state.editId;
  try {
    await Promise.race([deleteDoc(doc(db, "records", id)), new Promise((r) => setTimeout(r, 5000))]);
  } catch (e) { toast("削除できませんでした"); return; }
  state.editId = null; toast("削除しました"); go("history");
}

async function doRestore() {

  if (!text) { err.textContent = "ファイルを選ぶか、テキストを貼り付けてください。"; return; }

  try { d = JSON.parse(text); } catch (e) { err.textContent = "バックアップの内容を読み取れませんでした。"; return; }
  if (!d || d.app !== "shimada-kanri" || !Array.isArray(d.records)) { err.textContent = "物販台帳のバックアップではありません。"; return; }
  const ops = [];
  const isDate = (x) => typeof x === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x);
  const S = (x, n) => String(x == null ? "" : x).slice(0, n);
  const idOf = (col, x) => (x && x.id ? String(x.id) : doc(collection(db, col)).id);
  d.records.forEach((r) => {
    if (r && (r.type === "sales" || r.type === "expense") && isDate(r.date) && typeof r.amount === "number" && r.amount > 0) {
      const data = { type: r.type, date: r.date, amount: Math.round(r.amount), memo: S(r.memo, 100), by: r.by ? S(r.by, 30) : "バックアップ", uid: r.uid ? S(r.uid, 60) : me.uid, createdAt: r.createdAt || Date.now() };
      if (r.itemId) data.itemId = S(r.itemId, 60);
      if (r.lotId) data.lotId = S(r.lotId, 60);
      if (r.site) data.site = S(r.site, 20);
      if (typeof r.fee === "number" && r.fee >= 0) data.fee = Math.round(r.fee);
      if (typeof r.shipping === "number" && r.shipping >= 0) data.shipping = Math.round(r.shipping);
      if (r.shipMethod) data.shipMethod = S(r.shipMethod, 20);
      ops.push(["records", idOf("records", r), data]);
    }
  });
  (Array.isArray(d.lots) ? d.lots : []).forEach((l) => {
    if (l && typeof l.no === "string" && isDate(l.date)) ops.push(["lots", idOf("lots", l), { no: S(l.no, 30), seq: (typeof l.seq === "number" && l.seq > 0 ? Math.round(l.seq) : null), date: l.date, supplier: S(l.supplier, 40), mode: l.mode === "lot" ? "lot" : (l.mode === "item" ? "item" : ""), total: Math.max(0, Math.round(Number(l.total) || 0)), status: l.status === "open" ? "open" : "closed", closedDate: S(l.closedDate, 10), memo: S(l.memo, 60), by: l.by ? S(l.by, 30) : "バックアップ", createdAt: l.createdAt || Date.now(), recordId: S(l.recordId, 60) }]);
  });
  (Array.isArray(d.items) ? d.items : []).forEach((i) => {
    if (i && typeof i.name === "string" && i.name && typeof i.cost === "number" && (i.status === "stock" || i.status === "sold" || i.status === "lost")) {
      ops.push(["items", idOf("items", i), { lotId: S(i.lotId, 60), no: S(i.no, 40), name: S(i.name, 60), cost: Math.max(0, Math.round(i.cost)), status: i.status, price: Math.max(0, Math.round(i.price || 0)), soldDate: S(i.soldDate, 10), reason: S(i.reason, 20), lostDate: S(i.lostDate, 10), recordId: S(i.recordId, 60), site: S(i.site, 20), fee: Math.max(0, Math.round(i.fee || 0)), shipping: Math.max(0, Math.round(i.shipping || 0)), shipMethod: S(i.shipMethod, 20), thumb: (typeof i.thumb === "string" && i.thumb.indexOf("data:image/") === 0 && i.thumb.length < 20000 ? i.thumb : ""), photoId: S(i.photoId, 40), by: i.by ? S(i.by, 30) : "バックアップ", createdAt: i.createdAt || Date.now() }]);
    }
  });
  (Array.isArray(d.counts) ? d.counts : []).forEach((c) => {
    if (c && isDate(c.date) && typeof c.total === "number" && typeof c.missing === "number") ops.push(["counts", idOf("counts", c), { date: c.date, total: Math.round(c.total), missing: Math.round(c.missing), by: c.by ? S(c.by, 30) : "バックアップ", createdAt: c.createdAt || Date.now() }]);
  });
  const sitesOk = me.slot === "1" && Array.isArray(d.sites) ? d.sites.filter((x) => x && typeof x.name === "string" && x.name).map((x) => ({ id: S(x.id || ("s" + Math.random().toString(36).slice(2, 8)), 30), name: S(x.name, 20), rate: Math.min(100, Math.max(0, Number(x.rate) || 0)), fixed: Math.max(0, Math.round(Number(x.fixed) || 0)) })) : [];
  if (!ops.length && !sitesOk.length && !(me.slot === "1" && Array.isArray(d.suppliers) && d.suppliers.length)) { err.textContent = "使える記録がありませんでした。"; return; }
  if (sitesOk.length) ops.push(["state", "sites", { list: sitesOk }]);

  if (supOk.length) ops.push(["state", "suppliers", { list: supOk }]);
  msg.textContent = "復元しています…";

function closeOps(lot, extra) {
  // returns ops that finalize a lot; extra = [{ref,data}] new item docs already counted by caller
  const ops = [];
  const ex = lotItems(lot.id);
  const n = ex.length + (extra ? extra.length : 0);
  if (lot.mode === "lot" && n > 0) {
    const per = splitCost(lot.total || 0, n);
    ex.forEach((it, i) => { if (it.cost !== per[i]) ops.push(["update", doc(db, "items", it.id), { cost: per[i] }]); });
    if (extra) extra.forEach((x, k) => { x.data.cost = per[ex.length + k]; });
  }
  return ops;
}

async function saveLot(closeAfter) {
  const d = inv.draft, err = $("err"), rows = [];
  const ex = draftLot(d);
  const isLot = ex ? ex.mode === "lot" : d.mode === "lot";
  if (!ex && !isLot) closeAfter = true;
  if (ex && ex.status !== "open") { err.textContent = "このロットは、すでに終了しています。"; return; }
  if (!d.date) { err.textContent = "日付を選んでください。"; return; }
  let supName, lotTotal = 0;
  if (ex) supName = ex.supplier || "";
  else {
    if (!d.supplierId) { err.textContent = "仕入れ先を選んでください。"; return; }
    supName = draftSupplierName(d);
    if (!supName) { err.textContent = "仕入れ先の名前を入れてください。"; return; }
    if (isLot) {
      lotTotal = numOf(d.total);
      if (isNaN(lotTotal)) { err.textContent = "ロットの金額を入れてください。"; return; }
    }
  }
  let total = 0;
  for (let i = 0; i < d.rows.length; i++) {
    const r = d.rows[i], cost = isLot ? 0 : numOf(r.cost), qty = numOf(r.qty);
    if (!r.name.trim()) { err.textContent = (i + 1) + "行目の商品名を入れてください。"; return; }
    if (!isLot && isNaN(cost)) { err.textContent = (i + 1) + "行目の仕入れ値を入れてください。"; return; }
    if (isNaN(qty) || qty < 1 || qty > 99) { err.textContent = (i + 1) + "行目の個数は1〜99にしてください。"; return; }
    total += qty;
    rows.push({ photo: r.photo || null, code: (rowCustom(r) ? String(r.code) : "").normalize("NFKC").trim().slice(0, 30), name: r.name.trim().slice(0, 60), cost: cost, qty: qty });
  }
  if (total > 200) { err.textContent = "1回の登録は、合計200点までです。"; return; }
  const addCost = isLot ? 0 : rows.reduce((a, r) => a + r.cost * r.qty, 0);
  if (addCost >= 10000000000 || lotTotal >= 10000000000) { err.textContent = "金額が大きすぎます。"; return; }
  const seq = ex ? ex.seq : nextLotSeq();
  const no = ex ? ex.no : lotLabel(seq), pfx = ex ? lotPrefix(ex) : "L" + seq;
  const lotRef = ex ? doc(db, "lots", ex.id) : doc(collection(db, "lots")), lotId = ex ? ex.id : lotRef.id, now = Date.now();
  const used = new Set(stockItems().map((i) => normNo(i.no)));
  const plan = [];
  const photoRefs = {};
  rows.forEach((r, ri) => { if (r.photo) photoRefs[ri] = doc(collection(db, "photos")); });
  const autoNums = planNos(d);
  let autoN = 0;
  if (ex) items.forEach((x) => { if (x.lotId === ex.id) { const m = /-(\d{3})$/.exec(x.no || ""); if (m && x.no.indexOf(pfx + "-") === 0) autoN = Math.max(autoN, parseInt(m[1], 10)); } });
  for (let ri = 0; ri < rows.length; ri++) {
    const r = rows[ri];
    for (let k = 0; k < r.qty; k++) {
      let itemNo;
      if (r.code) itemNo = r.qty > 1 ? r.code + "-" + (k + 1) : r.code;
      else itemNo = String(autoNums[ri].nums[k]);
      const key = normNo(itemNo);
      if (used.has(key)) { err.textContent = "商品番号「" + itemNo + "」は、すでに使われています。"; return; }
      used.add(key);
      const idata = { lotId: lotId, no: itemNo, name: r.name, cost: r.cost, status: "stock", price: 0, soldDate: "", reason: "", lostDate: "", recordId: "", site: "", fee: 0, shipping: 0, by: me.name, createdAt: now };
      if (r.photo) { idata.thumb = r.photo.thumb; idata.photoId = photoRefs[ri].id; }
      plan.push({ ref: doc(collection(db, "items")), data: idata });
    }
  }
  const lotNow = ex ? Object.assign({}, ex) : { mode: d.mode, total: lotTotal };
  const ops = [];
  let expenseAmount = 0;
  if (!ex) {
    expenseAmount = isLot ? lotTotal : addCost;
    const expRef = expenseAmount > 0 ? doc(collection(db, "records")) : null;
    const lotData = { no: no, seq: seq, date: d.date, supplier: supName, mode: d.mode, total: expenseAmount, memo: d.memo.trim(), status: closeAfter ? "closed" : "open", by: me.name, createdAt: now, recordId: expRef ? expRef.id : "" };
    if (closeAfter) lotData.closedDate = today();
    ops.push(["set", lotRef, lotData]);
    if (expRef) ops.push(["set", expRef, { type: "expense", date: d.date, amount: expenseAmount, memo: (isLot ? "仕入れ " + no + "（" + supName + "）" : "仕入れ（" + supName + "）").slice(0, 100), by: me.name, uid: me.uid, createdAt: now, lotId: lotRef.id }]);
    lotNow.total = expenseAmount; lotNow.id = lotId; lotNow.status = closeAfter ? "closed" : "open";
  } else if (!isLot && addCost > 0) {
    expenseAmount = addCost;
    ops.push(["set", doc(collection(db, "records")), { type: "expense", date: d.date, amount: addCost, memo: ("仕入れ " + no + "（" + supName + "・追加）").slice(0, 100), by: me.name, uid: me.uid, createdAt: now, lotId: ex.id }]);
    ops.push(["update", lotRef, { total: (ex.total || 0) + addCost }]);
  }
  if (closeAfter) {
    const fin = closeOps(Object.assign({}, lotNow, { id: lotId }), plan);
    fin.forEach((o) => ops.push(o));
    if (ex) ops.push(["update", lotRef, { status: "closed", closedDate: today() }]);
  }
  Object.keys(photoRefs).forEach((ri) => ops.push(["set", photoRefs[ri], { data: rows[ri].photo.full, createdAt: now }]));
  plan.forEach((pl) => ops.push(["set", pl.ref, pl.data]));
  const btns = document.querySelectorAll('[data-act="savelot"],[data-act="savelotclose"]');
  const btn = document.querySelector('[data-act="savelot"]');
  if (btn) btn.disabled = true;
  const ok = await safe(commitOps(ops));
  if (!ok) { if (btn) btn.disabled = false; err.textContent = "登録できませんでした。通信や権限を確認してください。" + errSuffix(); return; }
  inv.draft = null; inv.filter = "stock"; inv.q = "";
  toast(no + (closeAfter ? " を登録して、終了しました" : " に登録しました") + (expenseAmount ? "。経費 " + yen(expenseAmount) + " を計上" : ""));
  go("stock");
}

async function closeLotOnly(btn) {
  const d = inv.draft, ex = draftLot(d), err = $("err");

  if (!btn.dataset.sure) { btn.dataset.sure = "1"; btn.textContent = "もう一度押すと、このロットを終了します"; return; }
  const ops = closeOps(ex, null);
  ops.push(["update", doc(db, "lots", ex.id), { status: "closed", closedDate: today() }]);
  const ok = await safe(commitOps(ops));
  if (!ok) { err.textContent = "終了できませんでした。通信や権限を確認してください。" + errSuffix(); return; }
  inv.draft = null;
  toast(ex.no + " を終了しました");
  go("stock");
}

async function invSheet(b) {
  const a = b.dataset.s;
  if (a === "itemedit") { sheetItemEdit(b.dataset.id); return true; }
  if (a === "itemcancel") { sheetItem(b.dataset.id); return true; }
  if (a === "item-save") {
    const it = itemById(b.dataset.id);
    if (!it) { closeSheet(); return true; }
    const err = $("ie-err"), name = val("ie-name").trim().slice(0, 60), no = val("ie-no").trim().slice(0, 40), dateV = val("ie-date");
    err.textContent = "";
    if (!name) { err.textContent = "商品名を入れてください。"; return true; }
    if (!no) { err.textContent = "商品番号を入れてください。"; return true; }
    const dupe = items.some((x) => x.id !== it.id && normNo(x.no) === normNo(no));
    if (dupe) { err.textContent = "この商品番号は、すでに他の商品で使われています。"; return true; }
    if (!dateV) { err.textContent = "日付を選んでください。"; return true; }
    const provisional = isProvisional(it);
    let cost = it.cost;
    if (!provisional) {
      cost = numOf(val("ie-cost"));
      if (isNaN(cost) || cost < 0) { err.textContent = "仕入れ値を入れてください。"; return true; }
    }
    const itemUpdate = { name: name, no: no, cost: cost };
    const sold = it.status === "sold";
    const lost = it.status === "lost";
    let recordUpdate = null;
    if (sold) {
      const price = numOf(val("ie-price")), fee = numOf(val("ie-fee")), ship = numOf(val("ie-ship")), site = val("ie-site").trim().slice(0, 20), soldDate = val("ie-solddate");
      if (isNaN(price) || price <= 0) { err.textContent = "売値を入れてください。"; return true; }
      const f0 = isNaN(fee) ? 0 : fee, h0 = isNaN(ship) ? 0 : ship;
      if (f0 > price) { err.textContent = "手数料が、売値より大きくなっています。"; return true; }
      if (!soldDate) { err.textContent = "売れた日を選んでください。"; return true; }
      itemUpdate.price = price; itemUpdate.fee = f0; itemUpdate.shipping = h0; itemUpdate.site = site; itemUpdate.soldDate = soldDate;
      recordUpdate = { amount: price, fee: f0, shipping: h0, site: site, date: soldDate };
    } else if (lost) {
      const reason = val("ie-reason"), lostDate = val("ie-lostdate");

      itemUpdate.reason = reason; itemUpdate.lostDate = lostDate;
    }
    const lot = lotOf(it);
    const batch = writeBatch(db);
    batch.update(doc(db, "items", it.id), itemUpdate);
    if (lot.id && lot.date !== dateV) batch.update(doc(db, "lots", lot.id), { date: dateV });
    if (recordUpdate && it.recordId) batch.update(doc(db, "records", it.recordId), recordUpdate);
    const ok = await safe(batch.commit());
    if (!ok) { err.textContent = "保存できませんでした。通信や権限を確認してください。" + errSuffix(); return true; }
    toast("保存しました");
    sheetItem(it.id);
    return true;
  }
  if (a === "suppliers") { supDraft = null; sheetSuppliers(); return true; }
  if (a === "sup-add") { supDraft.push({ id: "p" + Math.random().toString(36).slice(2, 8), name: "", mode: "item" }); sheetSuppliers(); return true; }
  if (a === "sup-rm") { supDraft.splice(+b.dataset.i, 1); sheetSuppliers(); return true; }
  if (a === "sup-save") {
    const err = $("sp-err"), names = {}, list = [];
    for (let i = 0; i < supDraft.length; i++) {
      const dd = supDraft[i], name = dd.name.trim();
      if (!name) { err.textContent = (i + 1) + "つ目の仕入れ先の名前を入れてください。"; return true; }
      if (names[name]) { err.textContent = "「" + name + "」が重なっています。"; return true; }
      names[name] = 1;
      list.push({ id: dd.id, name: name.slice(0, 20), mode: dd.mode === "lot" ? "lot" : "item" });
    }
    const ok = await safe(setDoc(doc(db, "state", "suppliers"), { list: list }));
    if (!ok) { err.textContent = "保存できませんでした。管理者のアカウントか確認してください。"; return true; }
    supDraft = null; sheetSuppliers("保存しました。");
    return true;
  }
  if (a === "sites") { siteDraft = null; sheetSites(); return true; }
  if (a === "site-add") { siteDraft.push({ id: "s" + Math.random().toString(36).slice(2, 8), name: "", rate: "0", fixed: "0" }); sheetSites(); return true; }
  if (a === "site-rm") { siteDraft.splice(+b.dataset.i, 1); sheetSites(); return true; }
  if (a === "site-save") {
    const err = $("st-err"), names = {}, list = [];
    for (let i = 0; i < siteDraft.length; i++) {
      const dd = siteDraft[i], name = dd.name.trim();
      if (!name) { err.textContent = (i + 1) + "つ目のサイト名を入れてください。"; return true; }
      if (names[name]) { err.textContent = "「" + name + "」が重なっています。"; return true; }
      names[name] = 1;
      list.push({ id: dd.id, name: name.slice(0, 20), rate: Number(dd.rate) || 0, fixed: Math.round(Number(dd.fixed) || 0) });
    }
    const ok = await safe(setDoc(doc(db, "state", "sites"), { list: list }));
    if (!ok) { err.textContent = "保存できませんでした。管理者のアカウントか確認してください。"; return true; }
    siteDraft = null; sheetSites("保存しました。");
    return true;
  }
  if (a === "tosale") {
    const t = itemById(b.dataset.id);
    if (t) { state.prefillNo = t.no; state.type = "sales"; state.editId = null; closeSheet(); go("add"); updateSaleHints(); }
    return true;
  }
  if (a !== "lose" && a !== "back" && a !== "apply") return false;
  if (a === "apply") {
    const m = inv.missing; if (!m) return true;
    const batch = writeBatch(db);
    m.ids.forEach((id) => {
      const sel = sheet.querySelector('select[data-miss="' + id + '"]');
      batch.update(doc(db, "items", id), { status: "lost", reason: sel ? sel.value : "紛失", lostDate: today() });
    });
    batch.set(doc(collection(db, "counts")), { date: today(), total: m.total, missing: m.ids.length, by: me.name, createdAt: Date.now() });
    batch.set(doc(db, "state", "count"), { active: false, checked: {} });
    const ok = await safe(batch.commit());
    if (!ok) { toast("反映できませんでした"); return true; }
    inv.missing = null; closeSheet(); toast("棚卸しを記録しました");
    return true;
  }
  const it = itemById(b.dataset.id);
  if (!it) { closeSheet(); return true; }
  if (a === "lose") {
    const ok = await safe(setDoc(doc(db, "items", it.id), { status: "lost", reason: b.dataset.r, lostDate: today() }, { merge: true }));
    closeSheet(); toast(ok ? "在庫から外しました" : "できませんでした");
  } else if (a === "back") {
    const batch = writeBatch(db);
    batch.update(doc(db, "items", it.id), { status: "stock", price: 0, soldDate: "", reason: "", lostDate: "", recordId: "", site: "", fee: 0, shipping: 0, shipMethod: "" });
    if (it.recordId) batch.delete(doc(db, "records", it.recordId));
    const ok = await safe(batch.commit());
    closeSheet(); toast(ok ? "在庫に戻しました" : "できませんでした");
  }
  return true;
}

function openPrintWindow(bodyHtml, title) {
  // ホーム画面に追加したアプリ（PWA）内では window.print() が反応しないことがあるため、
  // 別タブ（ブラウザ本体）を開いて、そちらで印刷ダイアログを出す。
  let w = null;
  try { w = window.open("", "_blank"); } catch (x) {}
  if (w && w.document) {
    w.document.open();
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title || "印刷") + '</title><style>' + PRINT_CSS + '</style></head><body>' + bodyHtml + '</body></html>');
    w.document.close();
    setTimeout(() => { try { w.focus(); w.print(); } catch (x) {} }, 250);
    return;
  }
  // 新しいタブが開けなかったとき（ポップアップブロックなど）は、その場での印刷にフォールバック
  $("printarea").innerHTML = "<style>" + PRINT_CSS + "</style>" + bodyHtml;
  setTimeout(() => { try { window.print(); } catch (x) {} }, 150);
  toast("印刷用の画面を開けませんでした。別タブが開ける設定か確認してください。");
}

function invClick(e) {
  const ti = e.target.closest("tr[data-item], .rk[data-item]");
  if (ti) { sheetItem(ti.dataset.item); return true; }
  const b = e.target.closest("button"); if (!b) return false;
  if (b.dataset.go === "stock") { go("stock"); return true; }
  if (b.dataset.cand) { const n = $("f-no"); if (n) { n.value = b.dataset.cand; updateSaleHints(); } return true; }
  if (b.dataset.photoRm !== undefined && inv.draft) { const r = inv.draft.rows[+b.dataset.photoRm]; if (r) { r.photo = null; render(true); } return true; }
  if (b.dataset.f) { inv.filter = b.dataset.f; render(true); return true; }
  if (b.dataset.chk) {
    const id = b.dataset.chk, cur = !!(countState && countState.checked && countState.checked[id]);
    setDoc(doc(db, "state", "count"), { checked: { [id]: !cur } }, { merge: true }).catch(() => toast("反映できませんでした"));
    return true;
  }
  if (b.dataset.rm) { inv.draft.rows.splice(+b.dataset.rm, 1); render(true); return true; }
  const a = b.dataset.act;
  if (a === "lotadd") { go("lotadd"); return true; }
  if (a === "tocount") { go("count"); return true; }
  if (a === "printstock") { printStock(); return true; }
  if (a === "addrow") { inv.draft.rows.push({ code: "", custom: false, name: "", cost: "", qty: "1", photo: null }); render(true); return true; }
  if (a === "savelot") { saveLot(false); return true; }
  if (a === "savelotclose") { saveLot(true); return true; }
  if (a === "closelot") { closeLotOnly(b); return true; }
  if (a === "startcount") {
    setDoc(doc(db, "state", "count"), { active: true, start: today(), by: me.name, checked: {} }).catch(() => toast("始められませんでした"));
    return true;
  }
  if (a === "cancelcount") {
    setDoc(doc(db, "state", "count"), { active: false, checked: {} }).catch(() => toast("できませんでした"));
    return true;
  }
  if (a === "finishcount") { sheetFinish(); return true; }
  return false;
}

/* ---------- analytics (charts + search) ---------- */
const anState = { period: "year", q: "" };
const PAL = ["#c48f9f", "#8f86ad", "#7f9bb5", "#a9917f", "#8fa89a", "#b49aa6", "#9aa7b8", "#c0a98e"];
function inPeriod(dateStr) {
  if (!dateStr) return false;
  const now = new Date();
  if (anState.period === "all") return true;
  if (anState.period === "month") return dateStr.slice(0, 7) === ym(now);
  return dateStr.slice(0, 4) === String(now.getFullYear());
}
const periodLabel = () => (anState.period === "month" ? "今月" : anState.period === "year" ? "今年" : "全期間");
function manText(n) {
  const a = Math.abs(n), sign = n < 0 ? "−" : "";
  if (a >= 10000) return sign + (Math.round(a / 1000) / 10) + "万";
  return sign + a.toLocaleString("ja-JP");
}
function niceStep(range, ticks) {
  const raw = Math.max(range, 1) / ticks, pow = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / pow;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow;
}
function monthlyChart() {
  const now = new Date(), months = [];
  for (let i = 11; i >= 0; i--) months.push(ym(new Date(now.getFullYear(), now.getMonth() - i, 1)));
  const data = months.map((m) => { const t = sums(records.filter((r) => r.date && r.date.slice(0, 7) === m)); return { m: m, s: t.s, p: t.b }; });
  let max = Math.max.apply(null, [1].concat(data.map((d) => Math.max(d.s, d.p, 0))));
  let min = Math.min.apply(null, [0].concat(data.map((d) => d.p)));
  const step = niceStep(max - min, 4);
  max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  const W = 340, H = 220, L = 46, R = 6, T = 10, B = 26, iw = W - L - R, ih = H - T - B;
  const y = (v) => T + ih - (v - min) / (max - min) * ih;
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="月別の売上と純利益">';
  for (let v = min; v <= max + 0.001; v += step) {
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (y(v) + 3).toFixed(1) + '" font-size="9" text-anchor="end" fill="var(--muted)">' + manText(v) + '</text>';
  }
  const gw = iw / 12, bw = gw * 0.32, z = y(0);
  data.forEach((d, i) => {
    const x0 = L + i * gw + gw * 0.14;
    const bar = (v, x, col) => {
      if (!v) return "";
      const top = Math.min(y(v), z), h = Math.max(Math.abs(y(v) - z), 1);
      return '<rect x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + col + '"/>';
    };
    svg += bar(d.s, x0, "var(--sales)") + bar(d.p, x0 + bw + 2, "var(--expense)") +
      '<text x="' + (L + i * gw + gw / 2).toFixed(1) + '" y="' + (H - 8) + '" font-size="9" text-anchor="middle" fill="var(--muted)">' + parseInt(d.m.slice(5), 10) + '月</text>';
  });
  svg += '</svg>';
  return svg;
}
function donutHtml(rawItems, fmtVal, emptyMsg) {
  let arr = rawItems.filter((x) => x.value > 0).sort((a, b) => b.value - a.value);
  if (!arr.length) return '<div class="empty" style="padding:18px 8px">' + esc(emptyMsg) + '</div>';
  if (arr.length > 6) { const rest = arr.slice(5).reduce((a, x) => a + x.value, 0); arr = arr.slice(0, 5).concat([{ name: "その他", value: rest }]); }
  const total = arr.reduce((a, x) => a + x.value, 0), r = 50, C = 2 * Math.PI * r;
  let off = 0, segs = "";
  arr.forEach((x, i) => {

function parseTrade(raw) {
  const nz = (x) => String(x == null ? "" : x).normalize("NFKC");
  const rawLines = nz(raw).split(/\r?\n/).map((l) => l.replace(/\s+/g, " ").trim()).filter((l) => l.length);
  const cmp = rawLines.map((l) => l.replace(/\s+/g, ""));

      const m = re.exec(cmp[i]);

      if (negRe && negRe.test(rest)) continue;
      let a = AMT.exec(rest);
      // ラベルと金額が別の行に分かれている場合（売上履歴の一覧画面など）：
      // 次の行が「-1,400円」のように符号・円つきの金額だけなら、それを拾う
      if (!a && cmp[i + 1]) a = /^[¥Y羊半]?-?(\d{1,3}(?:[,.]+\d{1,3})+|\d+)円?$/.exec(cmp[i + 1]);
      if (a) return { v: toNum(a[1]), i: i };
    }
    return null;
  };
  const p = grab(/商品代金|販売価格|商品金額|売上金額|落札価格|落札金額/);
  const f = grab(/販売手数料|システム利用料|手数料/);
  const s = grab(/配送料|発送料|送料/, /^(込|無料|別|は|負担)/);
  const pr = grab(/販売利益|売上金|受取金額|お受け取り金額|利益/);
  if (p) out.price = p.v; if (f) out.fee = f.v; if (s) out.ship = s.v; if (pr) out.profit = pr.v;

  // positional fallback: consecutive amount lines a - b - c = d
  const amts = [];
  cmp.forEach((l, i) => {
    const m = /(?:[¥Y羊半])?(\d{1,3}(?:[,.]+\d{1,3})+|\d{2,7})$/.exec(l);
    if (m && (/[¥Y羊半]/.test(l) || /,/.test(m[1]) || /[¥]/.test(rawLines[i]))) amts.push({ v: toNum(m[1]), i: i });
  });
  const okEq = out.price != null && out.fee != null && out.ship != null && out.profit != null && out.price - out.fee - out.ship === out.profit;
  if (!okEq) {
    for (let k = 0; k + 3 < amts.length; k++) {
      const [a, b, c, d] = [amts[k].v, amts[k + 1].v, amts[k + 2].v, amts[k + 3].v];
      if (a - b - c === d && a > 0) { out.price = a; out.fee = b; out.ship = c; out.profit = d; out.notes.push("位置から読み取り"); break; }
    }
  }
  // validation / repair
  const eq = (a, b, c, d) => a - b - c === d;
  if (out.price != null && out.fee != null && out.ship != null && out.profit != null) {
    if (eq(out.price, out.fee, out.ship, out.profit)) out.check = "ok";
    else {
      const orig = [out.price, out.fee, out.ship, out.profit];
      const strip = (n) => { const t = String(n); return t.length >= 2 ? parseInt(t.slice(1), 10) : n; };
      const sameHead = orig.every((n) => String(n).length >= 2 && String(n)[0] === String(orig[0])[0]);
      const all = orig.map(strip);
      let best = null;
      if (sameHead && eq(all[0], all[1], all[2], all[3])) best = all;   // ¥ misread as the same digit on every line
      if (!best) {
        const alt = (n) => { const t = String(n); return t.length >= 2 ? [n, parseInt(t.slice(1), 10)] : [n]; };
        const sols = [];
        alt(orig[0]).forEach((a) => alt(orig[1]).forEach((b) => alt(orig[2]).forEach((c) => alt(orig[3]).forEach((d) => { if (eq(a, b, c, d)) sols.push([a, b, c, d]); }))));
        sols.sort((x, y) => x.filter((v, i) => v !== orig[i]).length - y.filter((v, i) => v !== orig[i]).length);
        if (sols.length) best = sols[0];
      }
      if (best) { out.price = best[0]; out.fee = best[1]; out.ship = best[2]; out.profit = best[3]; out.check = "repaired"; }
      else out.check = "mismatch";
    }
  } else if (out.price != null && out.fee != null && out.ship == null && out.profit != null && out.price - out.fee - out.profit >= 0) { out.ship = out.price - out.fee - out.profit; out.check = "derived"; }
  else if (out.price != null && out.ship != null && out.fee == null && out.profit != null && out.price - out.ship - out.profit >= 0) { out.fee = out.price - out.ship - out.profit; out.check = "derived"; }
  else if (out.fee != null && out.ship != null && out.price == null && out.profit != null) { out.price = out.fee + out.ship + out.profit; out.check = "derived"; }

  // shipping method / payer
  for (let i = 0; i < cmp.length; i++) {
    const m = /配送の方法|配送方法|発送方法/.exec(cmp[i]);
    if (m) {
      let rest = cmp[i].slice(m.index + m[0].length).replace(/^[:：]+/, "").replace(/コピー$/, "");
      if (!rest && rawLines[i + 1]) rest = rawLines[i + 1].replace(/\s+/g, "");
      rest = rest.replace(/[|｜>＞〉]+$/, "").slice(0, 20);
      if (rest && !/^(送料|購入日時|商品ID)/.test(rest)) { out.method = rest; break; }

  // 売上履歴の一覧画面（複数商品）では、文中いちばん最初の日付が、画面の先頭
  // （まだ金額が「未確定」の別商品）のものになってしまうことがあるため、
  // 価格ラベルに近い（＝実際に金額を読み取った商品に近い）日付を優先する
  const isLabelLine = (l) => /商品代金|販売価格|商品金額|売上金額|落札価格|落札金額/.test(l);
  const priceLabelIdx = cmp.findIndex(isLabelLine);

  let dm = null;
  if (priceLabelIdx >= 0) {
    const lo = Math.max(0, priceLabelIdx - 8);
    for (let i = priceLabelIdx; i >= lo && !dm; i--) dm = DATE_RE.exec(rawLines[i]);
  }
  if (!dm) dm = DATE_RE.exec(rawLines.join(" "));

  // order id
  const joined = cmp.join(" ");
  let im = /([mM]\d{9,})/.exec(joined);
  if (im) out.orderId = "m" + im[1].slice(1);
  else { im = /(?:商品ID|取引ID|注文番号|注文ID|ID)[:：]?([A-Za-z0-9\-]{9,})/.exec(joined); if (im) out.orderId = im[1]; }

  // site
  if (/メルカリ/.test(joined) || /^m\d{9,}$/.test(out.orderId)) out.site = "メルカリ";
  else if (/ヤフオク|Yahoo!?オークション/i.test(joined)) out.site = "ヤフオク";
  else if (/ヤフーフリマ|Yahoo!?フリマ/i.test(joined) || /受取評価後に.{0,6}未確定.{0,10}表示|入金処理中の可能性があります/.test(joined)) out.site = "ヤフーフリマ";
  else if (/ラクマ/.test(joined)) out.site = "ラクマ";
  else if (/PayPayフリマ|ペイペイフリマ/.test(joined)) out.site = "PayPayフリマ";
  else if (/Amazon/i.test(joined)) out.site = "Amazon";

  // title: lines between 取引情報 (or the item name) and the first price label
  const isLabel = (l) => /商品代金|販売価格|商品金額|売上金額|落札価格|落札金額/.test(l);
  // 売上履歴の一覧画面（複数商品）では、商品名のあとに日付や「売上金」の金額行が
  // 挟まってから価格ラベルが来るため、価格ラベル・金額・日付・画面の地の文などの
  // 「商品名ではない行」を手前から読み飛ばして、実際の商品名の行をさかのぼって拾う
  const isNotTitle = (l) =>
    /^[¥Y羊半]?-?\d{1,3}(?:[,.]+\d{1,3})*円?$/.test(l) ||
    /^20\d{2}[年\/\-.]\d{1,2}[月\/\-.]\d{1,2}/.test(l) ||
    /商品代金|販売価格|商品金額|売上金額|落札価格|落札金額|販売手数料|システム利用料|手数料|配送料|発送料|送料|販売利益|売上金|受取金額|お受け取り金額|利益|未確定|取引情報|コピー|売上履歴|売上金管理|入金処理中|受取評価後|^(ホーム|さがす|出品|いいね!?|マイページ)$|^[>＞〉|｜\s]+$/.test(l);
  let first = cmp.findIndex(isLabel);
  if (first >= 0) {
    let start = cmp.findIndex((l) => /取引情報/.test(l));
    if (start < 0 || start >= first) {
      let j = first - 1, picked = [];
      while (j >= 0 && first - j <= 8) {
        if (isNotTitle(cmp[j])) { if (picked.length) break; j--; continue; }
        picked.unshift(j); j--;
      }
      start = picked.length ? picked[0] - 1 : Math.max(-1, first - 3);
    }
    const parts = [];
    for (let i = start + 1; i < first; i++) {
      const l = rawLines[i];
      if (/取引情報|コピー|^[>＞〉|｜\s]+$/.test(l) || isNotTitle(cmp[i])) continue;
      parts.push(l.replace(/[>＞〉|｜]+$/, "").trim());
    }
    out.title = parts.join(" ").replace(/\s+/g, " ").trim().slice(0, 100);
  }
  return out;
}
function bigrams(t) {
  const s = String(t || "").normalize("NFKC").toLowerCase().replace(/[\s\-_/・,.()（）「」【】\[\]!！?？]+/g, "");
  const set = new Set();
  if (s.length === 1) set.add(s);
  for (let i = 0; i < s.length - 1; i++) set.add(s.slice(i, i + 2));
  return set;
}
function similarity(a, b) {
  const A = bigrams(a), B = bigrams(b);
  if (!A.size || !B.size) return 0;
  let inter = 0; A.forEach((x) => { if (B.has(x)) inter++; });
  return inter / Math.min(A.size, B.size) * 0.6 + inter / (A.size + B.size - inter) * 0.4;
}

/* ---------- photos + trade-screenshot import ---------- */
async function fileToImage(file) {
  // 大きな写真（カメラの元画像など）を、フルサイズのまま丸ごとメモリに展開しないよう、
  // 対応しているブラウザでは、読み込みと同時に縮小する（メモリ不足によるページ強制終了を防ぐ）
  if (window.createImageBitmap) {
    try {
      const bmp = await createImageBitmap(file, { resizeWidth: 1800, resizeQuality: "medium" });
      return { img: bmp };
    } catch (e) {}
  }
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("read"));
    fr.onload = () => {
      const img = new Image();
      img.onload = () => res({ img: img });
      img.onerror = () => rej(new Error("decode"));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function scaledCanvas(img, maxSide) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, k = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function compressPhoto(file) {
  const r = await fileToImage(file);
  // データベース側の上限（1枚90万文字未満）に確実に収まるよう、大きければ段階的に縮小する
  const sizes = [360, 280, 200, 140], quals = [0.55, 0.5, 0.45, 0.4];
  let full = "";
  for (let i = 0; i < sizes.length; i++) {
    full = scaledCanvas(r.img, sizes[i]).toDataURL("image/jpeg", quals[i]);
    if (full.length < 400000) break;
  }
  return { full: full, thumb: scaledCanvas(r.img, 80).toDataURL("image/jpeg", 0.5) };
}
function ocrCanvas(img) {

  c.width = Math.round(Math.min(w0 * k, 2200)); c.height = Math.round(h0 * (c.width / w0));

  const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
  let sum = 0;
  for (let i = 0; i < a.length; i += 4) { const y = 0.299 * a[i] + 0.587 * a[i + 1] + 0.114 * a[i + 2]; a[i] = y; sum += y; }
  const dark = sum / (a.length / 4) < 128;
  for (let i = 0; i < a.length; i += 4) { let y = a[i]; if (dark) y = 255 - y; const v = y > 140 ? 255 : 0; a[i] = a[i + 1] = a[i + 2] = v; a[i + 3] = 255; }
  g.putImageData(d, 0, 0);
  return c;
}
function cropTradeThumb(img) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const x = Math.round(w * 0.03), y = Math.round(h * 0.28), cw = Math.round(w * 0.19), ch = Math.round(h * 0.12);
  const c = document.createElement("canvas");
  c.width = Math.max(1, cw); c.height = Math.max(1, ch);
  c.getContext("2d").drawImage(img, x, y, cw, ch, 0, 0, c.width, c.height);
  return c;
}
function imgHash(source) {
  const c = document.createElement("canvas");
  c.width = 8; c.height = 8;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(source, 0, 0, 8, 8);
  const d = g.getImageData(0, 0, 8, 8).data, gray = [];
  for (let i = 0; i < 64; i++) { const o = i * 4; gray.push(0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2]); }
  const avg = gray.reduce((a, b) => a + b, 0) / 64;
  return gray.map((v) => (v >= avg ? 1 : 0));
}
function hammingDist(a, b) {
  let d = 0;
  for (let i = 0; i < 64; i++) if (a[i] !== b[i]) d++;
  return d;
}
function hashFromDataUrl(durl) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => { try { res(imgHash(img)); } catch (e) { res(null); } };
    img.onerror = () => res(null);
    img.src = durl;
  });
}
async function matchByPhoto(queryCanvas, title) {
  const textCands = computeCands(title);
  let qh = null;
  try { qh = imgHash(queryCanvas); } catch (e) {}
  let imgCands = [];
  if (qh) {
    const pool = stockItems().filter((i) => i.thumb);
    const hashed = await Promise.all(pool.map(async (i) => ({ it: i, h: await hashFromDataUrl(i.thumb) })));
    imgCands = hashed.filter((x) => x.h).map((x) => ({ it: x.it, dist: hammingDist(qh, x.h) }))
      .filter((x) => x.dist <= 34).sort((a, b) => a.dist - b.dist).slice(0, 3);
  }
  const seen = new Set(imgCands.map((x) => x.it.id));
  const merged = imgCands.slice();
  textCands.forEach((x) => { if (merged.length < 3 && !seen.has(x.it.id)) { merged.push(x); seen.add(x.it.id); } });
  return { merged: merged, imgTop: imgCands[0] || null, imgRunner: imgCands[1] || null, textTop: textCands[0] || null, textRunner: textCands[1] || null };
}
let tessPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (tessPromise) return tessPromise;
  tessPromise = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    sc.onload = () => res(window.Tesseract);
    sc.onerror = () => { tessPromise = null; rej(new Error("load")); };
    document.head.appendChild(sc);
  });
  return tessPromise;
}
async function runOcr(canvas, onProgress) {
  const T = await loadTesseract();
  const worker = await T.createWorker("jpn", 1, {
    langPath: "https://tessdata.projectnaptha.com/4.0.0_fast",
    logger: (m) => { if (m && typeof m.progress === "number") onProgress(m.status || "", m.progress); }
  });
  try {
    await worker.setParameters({ tessedit_pageseg_mode: (T.PSM && T.PSM.SINGLE_BLOCK) || "6" });
    const r = await worker.recognize(canvas);
    return (r && r.data && r.data.text) || "";
  } finally { try { await worker.terminate(); } catch (e) {} }
}
function setOcrMsg(html, kind) {
  state.ocrHtml = html ? '<div class="ocrmsg ' + (kind || "") + '">' + html + '</div>' : "";
  const box = $("f-ocr");
  if (box) box.innerHTML = state.ocrHtml;
}
function computeCands(title) {
  if (!title) return [];
  return stockItems().map((it) => ({ it: it, sc: similarity(title, it.name) })).filter((x) => x.sc >= 0.25).sort((a, b) => b.sc - a.sc).slice(0, 3);
}
const thumbImg = (it) => (it && it.thumb ? '<img class="th" src="' + esc(it.thumb) + '" alt="">' : "");
function candsHtml(c) {
  if (!c.length) return "";
  return '<div class="note" style="margin:0 4px 6px">この商品ではありませんか？（押すと商品番号が入ります）</div><div class="cands">' +
    c.map((x) => '<button class="cand" data-cand="' + esc(x.it.no) + '">' + thumbImg(x.it) + '<span><b>' + esc(x.it.no) + '</b> ' + esc(x.it.name) + '</span></button>').join("") + '</div>';
}
function applyTrade(t, text, candInfo, queryThumbUrl) {
  const got = [];
  const vals = {};
  if (t.date) { vals["f-date"] = t.date; got.push("日付"); }
  if (t.price != null) { vals["f-amt"] = t.price.toLocaleString("ja-JP"); got.push("売値"); }
  if (t.fee != null) { vals["f-fee"] = t.fee.toLocaleString("ja-JP"); got.push("手数料"); }
  if (t.ship != null) { vals["f-ship"] = t.ship.toLocaleString("ja-JP"); got.push("送料"); }
  const over = { vals: vals };
  if (t.method) { const has = shipMethods().indexOf(t.method) >= 0; over.shipSel = has ? t.method : "__other"; if (!has) vals["f-shipm-o"] = t.method; got.push("発送方法"); }
  if (t.site) { const has = siteNames().indexOf(t.site) >= 0; over.siteSel = has ? t.site : "__other"; if (!has) vals["f-site-o"] = t.site; got.push("販売サイト"); }
  state.tradeId = t.orderId || "";
  if (t.orderId) got.push("取引ID");
  const ci = candInfo || { merged: computeCands(t.title), imgTop: null, imgRunner: null, textTop: null, textRunner: null };
  // 写真と商品名、どちらか一方だけでも確信が持てれば拾う（両方の一致を必須にしない）
  let matchedByPhoto = false, matchedByText = false;
  if (ci.imgTop && ci.imgTop.dist <= 14 && (!ci.imgRunner || ci.imgRunner.dist - ci.imgTop.dist >= 5)) { vals["f-no"] = ci.imgTop.it.no; matchedByPhoto = true; }
  else {
    const tc = computeCands(t.title);
    if (tc.length && tc[0].sc >= 0.45 && (tc.length === 1 || tc[0].sc - tc[1].sc >= 0.12)) { vals["f-no"] = tc[0].it.no; matchedByText = true; }
  }
  state.candsHtml = candsHtml(ci.merged);
  let msg;
  if (!got.length && !ci.merged.length) msg = "読み取れた項目がありません。別の画像にするか、手で入力してください。";
  else {
    msg = got.length ? "<b>自動で入りました：</b>" + got.join("、") + "。<br>内容を確認してから、記録してください。" : "<b>金額などは読み取れませんでした。</b>内容を確認してから、記録してください。";
    if (t.check === "ok") msg += "<br>金額の計算が合っています（売値−手数料−送料＝販売利益）。";
    else if (t.check === "repaired") msg += "<br>数字を一部補正しました。金額を確認してください。";
    else if (t.check === "derived") msg += "<br>足りない金額を、計算で補いました。";
    else if (t.check === "mismatch") msg += "<br>金額の計算が合いません。数字を確認してください。";
    if (t.shipper) msg += "<br>送料：" + esc(t.shipper) + "（配送料の金額を、送料に入れています）";
    if (matchedByPhoto) msg += "<br>商品番号：写真を見比べて、いちばん近い商品を自動で選びました。違う商品なら、下の候補か商品番号を直してください。";
    else if (matchedByText) msg += "<br>商品番号：商品名が近い商品を自動で選びました。違う商品なら、下の候補か商品番号を直してください。";
  }
  if (t.orderId && records.some((r) => r.orderId === t.orderId)) msg += '<br><span class="ng">この取引（' + esc(t.orderId) + '）は、すでに登録されています。</span>';
  if (queryThumbUrl) msg += '<div class="qthumb"><img src="' + esc(queryThumbUrl) + '" alt=""><span>商品の写真として、ここを比べました</span></div>';
  msg += '<details><summary>読み取った文字を見る</summary><pre>' + esc(text) + '</pre></details>';
  state.ocrHtml = '<div class="ocrmsg ' + ((got.length || ci.merged.length) ? "ok" : "err") + '">' + msg + '</div>';
  keepAndRender(over);
}
let ocrBusy = false, ocrToken = 0;
async function handleTradeImage(file) {
  if (!file) return;
  const myToken = ++ocrToken;
  const stillHere = () => myToken === ocrToken && state.view === "add" && state.type === "sales";
  ocrBusy = true;
  setOcrMsg("画像を読み取っています…（大きい画像や初回は、少し時間がかかります）", "busy");
  try {
    let r;
    try { r = await fileToImage(file); } catch (e) { if (stillHere()) setOcrMsg("画像を開けませんでした。もう一度選び直してください。", "err"); return; }
    let text = null;
    for (let attempt = 0; attempt < 2 && text === null; attempt++) {
      try {
        text = await runOcr(ocrCanvas(r.img), (st, p) => { if (stillHere()) setOcrMsg("画像を読み取っています…" + (attempt ? "（もう一度）" : "") + " " + Math.round(p * 100) + "%", "busy"); });
      } catch (e) {
        if (attempt === 0) { if (stillHere()) setOcrMsg("読み取り直しています…", "busy"); await new Promise((res) => setTimeout(res, 1200)); }
      }
    }
    if (!stillHere()) return;
    if (text === null) {
      setOcrMsg("読み取れませんでした。電波が弱いと、読み取り機能のデータ（数MB）が届かないことがあります。電波の良い場所でもう一度試すか、手で入力してください。", "err");
      return;
    }
    try {
      setOcrMsg("写真を見比べています…", "busy");
      const thumbC = cropTradeThumb(r.img);
      const cands = await matchByPhoto(thumbC, parseTrade(text).title);
      if (!stillHere()) return;
      applyTrade(parseTrade(text), text, cands, thumbC.toDataURL("image/jpeg", 0.7));
    } catch (e) {
      if (stillHere()) setOcrMsg("読み取れませんでした。通信を確認するか、手で入力してください。", "err");
    }
  } finally { if (myToken === ocrToken) ocrBusy = false; }
}
document.addEventListener("paste", (e) => {
  if (state.view !== "add" || state.type !== "sales" || state.editId) return;
  const list = e.clipboardData && e.clipboardData.items;
  if (!list) return;
  for (let i = 0; i < list.length; i++) {
    if (list[i].type && list[i].type.indexOf("image/") === 0) { const f = list[i].getAsFile(); if (f) { e.preventDefault(); handleTradeImage(f); } return; }
  }
});

/* ---------- events ---------- */
$("dock").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || !me) return;
  if (b.dataset.view === "add") {
    if (ocrBusy && state.view === "add" && state.type === "sales") { toast("画像を読み取っています。もう少しお待ちください。"); return; }
    state.editId = null; state.type = "sales"; state.tradeId = ""; state.ocrHtml = ""; state.candsHtml = "";
  }
  go(b.dataset.view);
});

function openEdit(id) {
  const er = records.filter((r) => r.id === id)[0];
  if (er && er.itemId && itemById(er.itemId)) { sheetItem(er.itemId); return; }
  state.editId = id;
  if (er) state.type = er.type;
  state.view = "add"; render();
}

app.addEventListener("click", (e) => {
  if (invClick(e)) return;
  const tr = e.target.closest("tr[data-edit]");
  if (tr) { openEdit(tr.dataset.edit); return; }
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "login") { doLogin(); return; }
  if (t.dataset.act === "mode-register") { loginMode = "register"; notice = ""; render(); return; }
  if (t.dataset.act === "mode-login") { loginMode = "login"; notice = ""; render(); return; }
  if (t.dataset.act === "settings") { sheetMenu(); return; }
  if (t.dataset.act === "print") { sheetPrint(); return; }
  if (t.dataset.act === "prev") { state.month = shiftMonth(state.month, -1); render(); return; }
  if (t.dataset.act === "next") { state.month = shiftMonth(state.month, 1); render(); return; }
  if (t.dataset.type) {
    state.type = t.dataset.type;
    keepAndRender();
    return;
  }
  if (t.id === "save") { doSave(); return; }
  if (t.id === "del") { doDelete(t); return; }
});

app.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.target.id === "l-id" || e.target.id === "l-pw" || e.target.id === "l-pw2" || e.target.id === "l-code")) doLogin();
});
app.addEventListener("input", (e) => {
  if (e.target.id === "f-amt") {
    const v = toHalf(e.target.value).replace(/[^0-9]/g, "").slice(0, 10);
    e.target.value = v ? Number(v).toLocaleString("ja-JP") : "";
  }
});

sheet.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "ie-cost") { t.value = fmtNum(t.value); return; }
  if (t.id === "ie-price" || t.id === "ie-fee" || t.id === "ie-ship") { t.value = fmtNum(t.value); return; }
  if (t.dataset && t.dataset.sp === "name" && supDraft) supDraft[+t.dataset.i].name = t.value;
  if (t.dataset && t.dataset.sd && siteDraft) {
    const i = +t.dataset.i, f = t.dataset.sd;
    if (f === "rate") t.value = toHalf(t.value).replace(/[^0-9.]/g, "");
    if (f === "fixed") t.value = digits(t.value);
    siteDraft[i][f] = t.value;
  }
});
sheet.addEventListener("change", (e) => {
  const t0 = e.target;
  if (t0.dataset && t0.dataset.iphoto && t0.files && t0.files[0]) {
    const id = t0.dataset.iphoto;
    compressPhoto(t0.files[0]).then(async (ph) => {
      const ref = doc(collection(db, "photos")), batch = writeBatch(db);
      batch.set(ref, { data: ph.full, createdAt: Date.now() });
      batch.update(doc(db, "items", id), { thumb: ph.thumb, photoId: ref.id });
      const ok = await safe(batch.commit());
      toast(ok ? "写真を保存しました" : "写真を保存できませんでした");
      const el = $("ph-img"); if (ok && el) el.src = ph.full;
    }, () => toast("写真を読み込めませんでした"));
    return;
  }
  if (e.target.dataset && e.target.dataset.sp === "mode" && supDraft) supDraft[+e.target.dataset.i].mode = e.target.value;
});
sheet.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b || !b.dataset.s) return;
  const a = b.dataset.s;
  if (await invSheet(b)) return;
  if (a === "close") closeSheet();
  else if (a === "menu") sheetMenu();
  else if (a === "pw") sheetPw();
  else if (a === "users") { usersPending = null; sheetUsers(); }
  else if (a === "backup") sheetBackup();
  else if (a === "logout") { closeSheet(); await signOut(auth); }
  else if (a === "u-del") {
    if (!me || me.slot !== "1") return;
    const target = members.filter((m) => m.uid === b.dataset.u)[0];
    if (!target || String(target.slot) === "1") return;
    if (usersPending !== target.uid) { usersPending = target.uid; sheetUsers(); return; }
    try {
      const batch = writeBatch(db);
      batch.delete(doc(db, "members", target.uid));
      batch.delete(doc(db, "slots", String(target.slot)));
      await batch.commit();
      usersPending = null; sheetUsers(target.name + "さんを削除しました。");
    } catch (x) { usersPending = null; sheetUsers("削除できませんでした。"); }
  }
  else if (a === "pw-save") {
    const o = val("p-old"), n = val("p-new"), n2 = val("p-new2"), er = $("p-err");
    if (!o || !n || !n2) { er.textContent = "すべて入力してください。"; return; }
    if (n.length < 6) { er.textContent = "新しいパスワードは6文字以上にしてください。"; return; }
    if (n !== n2) { er.textContent = "新しいパスワードが一致しません。"; return; }
    try {
      const u = auth.currentUser;
      await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, o));
      await updatePassword(u, n);
      closeSheet(); toast("パスワードを変更しました");
    } catch (x) {
      er.textContent = (x && (x.code === "auth/invalid-credential" || x.code === "auth/wrong-password")) ? "今のパスワードが違います。" : friendly(x);
    }
  }
  else if (a === "b-save") {
    try { downloadText("buppan-backup-" + today() + ".json", backupText(), "application/json"); $("b-msg").textContent = "バックアップを保存しました。"; }
    catch (x) { $("b-err").textContent = "保存できませんでした。「テキストとしてコピー」を使ってください。"; }
  }
  else if (a === "b-copy") {
    const txt = backupText();
    const fallback = () => { $("b-text").value = txt; $("b-text").select(); $("b-msg").textContent = "下の欄の文字を全選択してコピーしてください。"; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => { $("b-msg").textContent = "コピーしました。メモ帳などに貼り付けて保管してください。"; }, fallback);
    else fallback();
  }
  else if (a === "b-restore") doRestore();
  else if (a === "pr-now") {
    closeSheet();
    openPrintWindow(printBody(state.month), monthLabel(state.month));
  }
});
